name: Build Java Cooldown Animation

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  MOD_ID: java-cooldown-animation
  LIB_NAME: libjava_cooldown_animation.so
  ABI: arm64-v8a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check vendored preloader SDK
        run: |
          test -f third_party/preloader-android/include/pl/Config.hpp || {
            echo "::error::third_party/preloader-android is missing. Unzip preloader-android-main.zip into it."; exit 1; }

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Locate Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]; then
            NDK="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* | sort -V | tail -n1)"
          fi
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK"

      - name: Host - build and run cooldown logic unit test
        run: |
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host --target jca_logic_test jca_config_gen
          ./build/host/jca_logic_test

      - name: Android - build arm64-v8a mod library
        run: |
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/android --target java_cooldown_animation

      - name: Package .levipack
        run: |
          PKG="dist/$ABI/$MOD_ID"
          mkdir -p "$PKG/config"
          cp manifest.json "$PKG/manifest.json"
          cp "build/android/out/$ABI/$LIB_NAME" "$PKG/$LIB_NAME"
          ./build/host/jca_config_gen "$PKG"
          (cd "$PKG" && zip -r "../$MOD_ID.levipack" .)
          unzip -l "dist/$ABI/$MOD_ID.levipack"
          file "$PKG/$LIB_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-cooldown-animation-levipack
          path: dist/arm64-v8a/java-cooldown-animation.levipack

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/arm64-v8a/java-cooldown-animation.levipack
