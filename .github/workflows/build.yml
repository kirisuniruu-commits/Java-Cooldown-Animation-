name: Build Java Combat Animation

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  ABI: arm64-v8a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack preloader SDK
        run: |
          ZIP="$(ls preloader-android*.zip | head -n1)"
          mkdir -p third_party/_tmp
          unzip -q "$ZIP" -d third_party/_tmp
          mv third_party/_tmp/* third_party/preloader-android
          test -f third_party/preloader-android/include/pl/Config.hpp

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Locate NDK (prefer r27)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK="$(ls -d "$SDK"/ndk/27.* 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$NDK" ]; then NDK="$(ls -d "$SDK"/ndk/26.* 2>/dev/null | sort -V | tail -n1)"; fi
          if [ -z "$NDK" ]; then NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"; fi
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK"

      - name: Host build and test
        run: |
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host --target jca_logic_test jca_config_gen
          ./build/host/jca_logic_test

      - name: Android build
        run: |
          cmake -S . -B build/android -G Ninja -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-include cstdlib -include cstdint"
          cmake --build build/android --target java_cooldown_animation

      - name: Package levipack
        run: |
          # Find the zip that holds the Java Combat Animation packs, whatever it is named
          RES=""
          for z in *.zip; do
            if unzip -l "$z" 2>/dev/null | grep -q "JavaCombatAnimation_RP/manifest.json"; then RES="$z"; break; fi
          done
          if [ -z "$RES" ]; then
            echo "::error::The Java Combat Animation resources zip was not found in the repo. Files in the repo root:"
            ls -la
            exit 1
          fi
          echo "Using resources zip: $RES"
          mkdir -p pkg
          cp manifest.json pkg/
          cp build/android/out/$ABI/libjava_cooldown_animation.so pkg/
          unzip -q "$RES" -d pkg
          test -f pkg/resources/minecraft_resource_packs/JavaCombatAnimation_RP/manifest.json
          test -f pkg/resources/minecraft_behavior_packs/JavaCombatAnimation_BP/manifest.json
          cd pkg && zip -qr ../java-combat-animation.levipack . && cd ..
          unzip -l java-combat-animation.levipack | tail -n 5

      - uses: actions/upload-artifact@v4
        with:
          name: java-combat-animation-levipack
          path: java-combat-animation.levipack

      - name: Publish to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          files: java-combat-animation.levipack
